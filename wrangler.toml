# Cloudflare Workers bindings config — the single source the build inherits.
# Do NOT set `main` or `[assets]` here: @astrojs/cloudflare generates
# dist/server/wrangler.json at build time (entry, assets, auto-provisioned
# SESSION KV binding) merging whatever this file declares.
#
# Deploy: npm run build && wrangler deploy -c dist/server/wrangler.json
#
# Secrets (never in this file — `wrangler secret put <NAME>`):
#   SUPABASE_SERVICE_ROLE_KEY, VAPID_*, POLAR_* (see .env.example)
# Local dev: copy .dev.vars.example to .dev.vars — the adapter's platformProxy
# (enabled in astro.config.mjs) loads it into locals.runtime.env on `astro dev`.

name = "alapar"
compatibility_date = "2025-10-01"
compatibility_flags = ["nodejs_compat"]

# Invocation logs (exceptions included) — must be declared here or every
# `wrangler deploy` silently resets the dashboard setting to off.
[observability]
enabled = true

# Non-secret vars: public by design (the anon key is protected by RLS and is
# shipped to the browser anyway). With nodejs_compat these also populate
# process.env, which is how src/lib/env.ts reads them.
[vars]
SUPABASE_URL = "https://ezfcmgbavmjecuaempta.supabase.co"
SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV6ZmNtZ2Jhdm1qZWN1YWVtcHRhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUyNjM0MTUsImV4cCI6MjA5MDgzOTQxNX0.PcF1A6pzsXoEtenTgvvhWEWWtkidvpAFPEa68GyRVLE"

# Hyperdrive: bounded connection pool + query cache in front of the Supabase
# Postgres. The middleware reads HYPERDRIVE.connectionString once per isolate
# and registers it with lib/db.ts (which builds its pg.Pool lazily).
# Create it first: `wrangler hyperdrive create alapar-db --connection-string=...`
# then uncomment with the returned id.
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "829b266d30d4461f9f85af4091c6a1c6"
# What miniflare connects to when SIMULATING Hyperdrive on `astro dev` —
# never talks to the real Hyperdrive service locally. Points at the
# docker-compose Postgres (docker compose up db).
localConnectionString = "postgresql://alapar:alapar@localhost:5432/alapar"
