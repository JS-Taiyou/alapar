name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, migration/astro]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "26.10"
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npx astro check

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run fmt:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # Manual deploy to Cloudflare Workers (run CI first; requires the
  # CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID repo secrets).
  deploy:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "26.10"
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy Worker
        run: npx wrangler deploy -c dist/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
