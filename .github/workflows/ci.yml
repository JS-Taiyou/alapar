name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, migration/astro]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "26.10"
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npx astro check

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run fmt:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # Manual deploy to Cloudflare Workers (run CI first; requires the
  # CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID repo secrets).
  deploy:
    needs: check
    if: >-
      always() && needs.check.result == 'success' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' &&
        (github.ref == 'refs/heads/migration/astro' || github.ref == 'refs/heads/main')))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "26.10"
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Debug credentials (safe: no secret values printed)
        run: |
          echo "TOKEN set: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}"
          echo "ACCOUNT set: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}"
          npx wrangler whoami 2>&1 | tail -5

      - name: Deploy Worker
        run: npx wrangler deploy -c dist/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
